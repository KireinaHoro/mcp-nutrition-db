[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-nutrition-db"
version = "0.1.0"
description = "Private MCP service for a conversational nutrition log"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "KireinaHoro" }]
dependencies = [
  "mcp>=1.29,<2",
  "pydantic>=2.11,<3",
]

[project.scripts]
mcp-nutrition-db = "mcp_nutrition_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mcp_nutrition_db"]
